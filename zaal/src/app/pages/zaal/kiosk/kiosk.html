<!--
  Vóór de loting is de tablet de aanwezigheidslijst: iedereen duidt zichzelf aan
  zodra hij binnen is. Dat is meteen het antwoord op "waarom sta ik hier" in het
  eerste kwartier — er stond eerst een paneel dat zei dat er niets te doen was,
  met een grote knop naar het scherm van de organisator erbij.

  Er is geen omleiding voor nodig: het beginscherm ís dit blad zolang er geen
  wedstrijden zijn, en wordt de namenvinder zodra er geloot is. "Speeldag starten"
  landt dus vanzelf goed, en de terugvalklok komt hier ook uit.
-->
@if (api.games().length === 0) {
  <app-attendance-finder />
} @else {
  <app-player-finder
    [players]="api.presentPlayers()"
    [games]="api.games()"
    (picked)="onPicked($event)"
  />
}

<!--
  De twee bestemmingen waarvoor spelers zelf langskomen, in het leespad onder het
  alfabet in plaats van als ghost-knop in de rechterbovenhoek. Ze vullen de
  ruimte die daar toch al leeg stond.
-->
<nav class="bestemmingen" aria-label="Bekijken">
  <button
    type="button"
    class="bestemming"
    routerLink="/wedstrijden"
    [disabled]="api.games().length === 0"
  >
    <span class="bestemming-titel">Wedstrijden van vanavond</span>
    <span class="bestemming-onder">
      @if (api.games().length === 0) {
        de loting moet nog gebeuren
      } @else if (api.gamesWithoutScore().length === 0) {
        alle {{ api.games().length }} uitslagen binnen
      } @else {
        {{ api.games().length - api.gamesWithoutScore().length }} van de
        {{ api.games().length }} uitslagen binnen
      }
    </span>
  </button>

  <button type="button" class="bestemming" routerLink="/tussenstand">
    <span class="bestemming-titel">Tussenstand</span>
    <span class="bestemming-onder">hoe je ervoor staat dit seizoen</span>
  </button>
</nav>
