<div class="search-row">
  <label class="visually-hidden" for="player-search">Zoek een speler</label>
  <input
    id="player-search"
    type="search"
    placeholder="Zoek een speler…"
    [value]="searchTerm()"
    (input)="searchTerm.set($any($event.target).value)"
  />
  <button type="button" routerLink="nieuwe-speler">+ Nieuwe speler</button>
</div>

<div class="filters" role="group" aria-label="Toon" [attr.data-gekozen]="filterPlaats()">
  <button type="button" [attr.aria-pressed]="filter() === 'alle'" (click)="filter.set('alle')">
    Alle <span class="telling">{{ tellingen().alle }}</span>
  </button>
  <button
    type="button"
    [attr.aria-pressed]="filter() === 'aanwezig'"
    (click)="filter.set('aanwezig')"
  >
    <span class="stip aan" aria-hidden="true"></span>
    Aanwezig <span class="telling">{{ tellingen().aanwezig }}</span>
  </button>
  <button
    type="button"
    [attr.aria-pressed]="filter() === 'afwezig'"
    (click)="filter.set('afwezig')"
  >
    <span class="stip uit" aria-hidden="true"></span>
    Afwezig <span class="telling">{{ tellingen().afwezig }}</span>
  </button>
</div>

<app-attendance-list
  [players]="shownPlayers()"
  [leeg]="leegTekst()"
  (toggled)="onToggled($event)"
/>

<button
  type="button"
  class="primair wide"
  [disabled]="api.isBusy() || api.presentCount() < 4"
  (click)="draw()"
>
  Loten ({{ api.presentCount() }} aanwezig)
</button>

<button type="button" class="afmelden" (click)="signOut()">Afmelden</button>

<router-outlet />
