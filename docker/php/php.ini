memory_limit=512M
upload_max_filesize=32M
post_max_size=32M
date.timezone=Europe/Brussels
auto_prepend_file=/usr/local/etc/php/docker-env.php

; Xdebug 3 leest XDEBUG_MODE uit de omgeving (standaard off in compose).
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.start_with_request=yes
xdebug.log_level=0
