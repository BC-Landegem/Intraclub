name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-experimental:
    name: api-experimental (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    defaults:
      run:
        working-directory: api-experimental
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, mbstring, intl
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        # composer.lock is intentionally not committed (see .gitignore), so resolve fresh.
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Coding standard (PHP-CS-Fixer)
        run: composer cs:check

      - name: Coding standard (PHP_CodeSniffer)
        run: composer sniffer:check

      - name: Static analysis (PHPStan)
        run: composer stan

      - name: Unit tests (PHPUnit)
        run: composer test

  api-lint:
    name: api (lint PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Lint PHP sources
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
